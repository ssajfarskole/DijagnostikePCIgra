PU temperatura je sada 45°C i sustav je stabilan!",educationalNote:"📖 Pregrijavanje je jedan od najčešćih problema u starijim računalima. Uzroci: 1) Suha termalna pasta (mijenja se svakih 2-3 godine), 2) Prašina u hladnjaku koja blokira protok zraka, 3) Labavi kablovi napajanja koji smanjuju napon. CPU ima termalno šutilo na ~100°C i automatski gasi se da se ne bi ošteti. Redoslijed rješavanja: odvajanje kabela → uklanjanje hladnjaka → čišćenje → nova pasta → ponovno montiranje.",hint:"💡 Redoslijed je BITAN! Prvo odspojite oba CPU napojća kablova, zatim odvijačem uklonite hladnjak, očistite ga zrakom, nanijsite pastu na CPU, vratite hladnjak i konačno ponovno spojite kablove!"},{id:4,name:"Nema slike na monitoru",description:'Računalo se pali, čuju se normalni zvukovi pokretanja, ali na monitoru nema slike. Monitor prikazuje "No Signal".',symptoms:['📺 Monitor prikazuje poruku "No Signal".',"🔊 Računalo se čini da se normalno pali bez čudnih zvukova.","💡 LED diode na kućištu svijetle normalno tijekom pokretanja.","🌀 Ventilatori se vrte normalno, ali nema slike."],difficulty:"Srednje",difficultyStars:2,components:$e({gpu:"loose",gpuPowerCable:"loose"}),fixes:[{componentId:"gpuPowerCable",toolId:"screwdriver",description:"✅ GPU kabel napajanja je odspojen od grafičke kartice!",targetStatus:"removed"},{componentId:"gpu",toolId:"screwdriver",description:"✅ GPU je izvađena iz PCIe utora! Vidljivo je da je bila labavo postavljena.",targetStatus:"removed"},{componentId:"gpu",toolId:"replacement",description:'✅ GPU je ponovno pravilno postavljena u PCIe utor! Čule se dva "klika" koji pokazuju da je sada čvrsto sjedila.',targetStatus:"working"},{componentId:"gpuPowerCable",toolId:"hand",description:"✅ GPU kabel napajanja je ponovno spojen i čvrsto stegnut! Grafička kartica sada dobija sve potrebne volte.",targetStatus:"working"}],diagnostics:[{componentId:"motherboard",toolId:"postCard",message:"🖥️ POST kod: 1 dugi, 2 kratka piska = GREŠKA GRAFIČKE KARTICE! GPU nije pravilno prepoznat od BIOSA. Provjerite PCIe konekciju.",type:"error"},{componentId:"gpu",toolId:"magnifier",message:"🔍 Vizualni pregled GPU-a: Kartica je LABAVO POSTAVLJENA u PCIe utoru! Desna strana je vidljivo podignuta - nije pravilno sjela u 16-pin utor.",type:"error"},{componentId:"gpuPowerCable",toolId:"magnifier",message:"🔍 Kabel napajanja GPU-a je DJELOMIČNO ODVOJEN! Priključak PCIe nije čvrsto spojen. Ako bi se računalo duže koristilo, kartica bi mogla biti oštećena.",type:"error"},{componentId:"gpu",toolId:"thermalCamera",message:"🌡️ GPU temperatura: N/A - kartica nije pravilno spojena pa sustav je ne detektuje.",type:"warning"},{componentId:"cpu",toolId:"magnifier",message:"🔍 Procesor je pravilno postavljen i izgleda u redu.",type:"info"},{componentId:"ram1",toolId:"magnifier",message:"🔍 RAM moduli su pravilno postavljeni u DIMM utore.",type:"info"},{componentId:"psu",toolId:"powerTester",message:"🔌 Napajanje radi normalno, svi naponi (12V, 5V, 3.3V) su unutar granica.",type:"info"},{componentId:"motherboard",toolId:"magnifier",message:"🔍 Matična ploča izgleda u redu, PCIe utori nisu fizički oštećeni.",type:"info"}],completionMessage:"🏆 Odlično! Grafička kartica je sada pravilno postavljena u PCIe utor i kabel napajanja je sigurno spojen. Slika se vraća na monitor!",educationalNote:'📖 Grafička kartica mora biti čvrsto postavljena u PCIe x16 utor i imati properno spojen kabel napajanja (PCIe 6-pin ili 8-pin). Ako je labava, sustav će je detektovati ali neće raditi. Čujete dva "klika" kad je kartica pravilno postavljena. GPU se koristi za 3D grafiku i gaming.',hint:'💡 Slijedi red: Prvo odvijačem odspojite GPU kabel napajanja, zatim odvijačem izvadite GPU iz PCIe utora, ponovo je postavite (trebali biste čuti "klik"), i na kraju vratite kabel napajanja rukom.'},{id:5,name:"Čudni zvukovi i sporo pokretanje",description:"Računalo radi sve sporije. Čuje se klikatanje iz kućišta. Pokretanje Windowsa traje jako dugo, a programi se sporo učitavaju.",symptoms:['🔊 U kućištu se čuju čudni klikovi i kliktanje - "CLICK OF DEATH".',"🐌 Windows se pokreće jako sporo i sve traje duže nego prije.","⏳ Programi trebaju 30+ sekundi da se pokrenu.","❌ Ekran se povremeno zamrzava bez upozorenja i gljava se."],difficulty:"Srednje",difficultyStars:2,components:$e({hdd:"failing",sataCable1:"loose",ssd:"removed"}),fixes:[{componentId:"sataCable1",toolId:"screwdriver",description:"✅ SATA kabel za HDD je odspojen od matične ploče!",targetStatus:"removed"},{componentId:"hdd",toolId:"screwdriver",description:"✅ Pokvareni HDD je izvađen iz kućišta s odvijačem! Jasno se vidi da je disk oštećen.",targetStatus:"removed"},{componentId:"ssd",toolId:"replacement",description:"✅ Novi SSD disk je instaliran u kućište! Brži je i bez pokretnih dijelova.",targetStatus:"working"},{componentId:"sataCable1",toolId:"hand",description:"✅ SATA kabel je ponovno spojen - od matične ploče do novog SSD-a! Disk je sada prepoznat.",targetStatus:"working"}],diagnostics:[{componentId:"hdd",toolId:"magnifier",message:'🔍 Hard disk proizvodi glasne zvukove klikanja i krekanja - to je "CLICK OF DEATH"! Mehanički dio diska je ozbiljno oštećen. Disk će uskoro potpuno zatajiti i neće se moći čitati!',type:"error"},{componentId:"hdd",toolId:"diagnosticDisk",message:`💿 SMART dijagnostika HDD-a:
❌ Reallocirani sektori: 1,247 (KRITIČNO!)
❌ Seek Error Rate: EKSTREMNO VISOK
❌ Spin Retry Count: 47
⚠️ Temperatura: 56°C (visoka)
⚠️ Radno vrijeme: 45,231 sati (Star disk!)
🔴 DISK JE MRTAV - ZAMJENA JE HITAN PRIORITET!`,type:"error"},{componentId:"sataCable1",toolId:"magnifier",message:"🔍 SATA kabel je labav! Veza između HDD-a i matične ploče nije sigurna i diskontinuirana je.",type:"warning"},{componentId:"ssd",toolId:"magnifier",message:"🔍 Novi SSD disk je čist, ne vidljivo oštećenja. Spreman za instalaciju.",type:"info"},{componentId:"ssd",toolId:"diagnosticDisk",message:"💿 SSD SMART status: ✅ Nova konekcija detektovana. Disk je zdrav. Broj životnog vijeka: 100% (potpuno nov). Brzina čitanja: 550MB/s, pisanja: 520MB/s.",type:"info"},{componentId:"cpu",toolId:"magnifier",message:"🔍 Procesor izgleda u redu. Temperatura: 52°C.",type:"info"},{componentId:"ram1",toolId:"magnifier",message:"🔍 RAM memorija je ispravna.",type:"info"},{componentId:"gpu",toolId:"magnifier",message:"🔍 Grafička kartica je u redu.",type:"info"},{componentId:"motherboard",toolId:"magnifier",message:"🔍 Matična ploča izgleda ispravno. SATA priključci su OK.",type:"info"}],completionMessage:"🏆 Genijalno! Zamijenili ste stari pokvareni HDD novim bržim SSD-om. Računalo se sada pali za 12 sekundi umjesto 2+ minute!",educationalNote:'📖 HDD (Hard Disk Drive) ima mehaničke dijelove (rotirajući disk, glava za čitanje) koji se s vremenom troše i mogu se oštetiti. "Click of death" su karakteristični zvukovi koji znače da je glava zapela i disk gubi podatke. SSD (Solid State Drive) nema pokretnih dijelova, puno je brži (4-10x) i izdržljiviji. Moderni SSD-ovi koriste NVMe (M.2) umjesto SATA-e.',hint:"💡 Slijedi red: Prvo dijagnostičkim diskom potvrdite kvar HDD-a, zatim odvijačem odspojite SATA kabel, pa zamijenite stari disk novim SSD-om i na kraju ponovno spojite SATA kabel. Redoslijed je bitan!"},{id:6,name:"BIOS greška pri pokretanju",description:"Računalo pri paljenju prijavljuje BIOS grešku i neće nastaviti s pokretanjem bez učitavanja zadanih postavki.",symptoms:['❌ Pojavljuje se poruka "CMOS Checksum Error - Defaults Loaded".',"⚠️ BIOS javlja da su spremljene postavke izgubljene.","🕐 Datum i vrijeme u sustavu su resetirani na zadane vrijednosti.","⚙️ BIOS se vraća na tvorničke postavke i ne nastavlja normalno podizanje."],difficulty:"Teško",difficultyStars:3,components:$e({cmosBattery:"broken"}),fixes:[{componentId:"cmosBattery",toolId:"replacement",description:"✅ Stari CMOS sklop je uklonjen i nova CR2032 zamjena je instalirana! BIOS je resetiran na tvorničke postavke.",targetStatus:"working"}],diagnostics:[{componentId:"motherboard",toolId:"postCard",message:"🖥️ POST kod: CMOS Checksum Error - Bad! BIOS ne može učitati spremljene postavke i vraća zadane vrijednosti.",type:"error"},{componentId:"cmosBattery",toolId:"magnifier",message:"🔍 Vizualni pregled CMOS sklopa: Na okruglom modulu i kontaktima vidi se starenje i tragovi korozije.",type:"error"},{componentId:"cmosBattery",toolId:"powerTester",message:"🔌 Test sklopa pokazuje vrlo nizak napon i nestabilno zadržavanje postavki.",type:"error"},{componentId:"cpu",toolId:"magnifier",message:"🔍 Procesor izgleda u redu.",type:"info"},{componentId:"ram1",toolId:"magnifier",message:"🔍 RAM memorija je u redu.",type:"info"},{componentId:"gpu",toolId:"magnifier",message:"🔍 Grafička kartica je u redu.",type:"info"},{componentId:"psu",toolId:"powerTester",message:"🔌 Napajanje radi normalno, svi naponi su OK.",type:"info"}],completionMessage:"🏆 Izvrsno! Zamijenili ste CMOS sklop i računalo sada normalno pokreće BIOS i nastavlja s boot!",educationalNote:"📖 CMOS sklop (CR2032) napaja mali memorijski čip na matičnoj ploči koji čuva BIOS postavke i sat. Kad se taj izvor napajanja isprazni, BIOS zaboravi postavke i javlja grešku. Zamjena je jednostavna i jeftina.",hint:"💡 Koristite POST karticu da pročitate BIOS poruku, a zatim pogledajte mali okrugli CMOS sklop na matičnoj ploči."},{id:7,name:"Kombinirani problemi - Izazov!",description:"Računalo ima VIŠE problema istovremeno! Pregrijava se, povremeno plavi ekran, i monitor gubi signal. Ovo je pravi izazov za dijagnostičara!",symptoms:["🔥 Računalo se pregrijava i povremeno se gasi.","🔵 Povremeno se pojavljuje plavi ekran (BSOD).","📺 Monitor povremeno gubi signal tijekom rada.","🔊 Ventilator jako zuji i radi brzo.","⚡ Neki programi se ruše bez upozorenja."],difficulty:"Teško",difficultyStars:3,components:$e({cpuFan:"dusty",cpu:"overheating",cpuMboCable:"loose",cpuPowerCable:"loose",ram2:"failing",gpu:"loose",gpuPowerCable:"loose"}),fixes:[{componentId:"cpuMboCable",toolId:"screwdriver",description:"✅ CPU MBO (4-pin) kabel je odspojen od matične ploče!",targetStatus:"removed"},{componentId:"cpuPowerCable",toolId:"screwdriver",description:"✅ CPU 8-pin kabel napajanja je odspojen!",targetStatus:"removed"},{componentId:"cpuFan",toolId:"screwdriver",description:"✅ CPU hladnjak je odspojen od procesora!",targetStatus:"removed"},{componentId:"cpuFan",toolId:"compressedAir",description:"✅ CPU hladnjak je očišćen od prašine kompresiranim zrakom!",targetStatus:"removed"},{componentId:"cpu",toolId:"thermalPaste",description:"✅ Nova termalna pasta je nanešena na procesor!",targetStatus:"working"},{componentId:"cpuFan",toolId:"hand",description:"✅ CPU hladnjak je ponovno pričvršćen na procesor!",targetStatus:"working"},{componentId:"ram2",toolId:"screwdriver",description:"✅ Pokvareni RAM modul 2 je odspojen odvijačem iz DIMM utora!",targetStatus:"removed"},{componentId:"ram2",toolId:"replacement",description:"✅ Pokvareni RAM modul 2 je zamijenjen novim RAM modulom!",targetStatus:"working"},{componentId:"gpuPowerCable",toolId:"screwdriver",description:"✅ Kabel napajanja GPU je odspojen! Sada možete sigurno provjeriti kartu.",targetStatus:"removed"},{componentId:"gpuPowerCable",toolId:"hand",description:"✅ Kabel napajanja GPU je ponovno spojen i sigurno sjedne u utor!",targetStatus:"working"},{componentId:"gpu",toolId:"screwdriver",description:"✅ GPU je izvađena iz PCIe x16 utora!",targetStatus:"removed"},{componentId:"gpu",toolId:"replacement",description:"✅ GPU je ponovno pravilno postavljena u PCIe utor!",targetStatus:"working"}],diagnostics:[{componentId:"cpu",toolId:"thermalCamera",message:"🌡️ CPU temperatura: 93°C! Pregrijavanje! To uzrokuje throttling i gašenje sustava.",type:"error"},{componentId:"cpuFan",toolId:"magnifier",message:"🔍 CPU hladnjak je prepun prašine! Rešetke su začepljene.",type:"error"},{componentId:"cpu",toolId:"magnifier",message:"🔍 Termalna pasta na CPU je suha i ne provodi dobro toplinu.",type:"warning"},{componentId:"motherboard",toolId:"postCard",message:"🖥️ POST kod: Greška memorije (1 dugi, 3 kratka piska) + upozorenje GPU-a. Višestruki problemi!",type:"error"},{componentId:"ram2",toolId:"magnifier",message:"🔍 RAM modul 2 pokazuje znakove oštećenja. Čip je pregrijan.",type:"error"},{componentId:"ram1",toolId:"magnifier",message:"🔍 RAM modul 1 je u redu.",type:"info"},{componentId:"gpu",toolId:"magnifier",message:"🔍 GPU je labav u PCIe utoru! Desna strana je podignuta.",type:"error"},{componentId:"gpu",toolId:"thermalCamera",message:"🌡️ GPU temperatura: 58°C (normalno) ali GPU nije pravilno spojen.",type:"warning"},{componentId:"psu",toolId:"powerTester",message:"🔌 Napajanje radi ispravno, svi naponi OK.",type:"info"},{componentId:"hdd",toolId:"diagnosticDisk",message:"💿 Hard disk je ispravan.",type:"info"}],completionMessage:"🏆 Genijalno! Riješili ste SVE probleme! Računalo sada radi savršeno - temperatura je normalna, memorija stabilna, i slika čista! Pravi ste majstor za dijagnostiku!",educationalNote:"📖 U stvarnom svijetu, računala često imaju više problema istovremeno. Ključno je sustavno dijagnosticirati svaki problem: provjeriti napajanje, temperature, memoriju, grafičku karticu i diskove. Uvijek počnite od najjednostavnijih dijagnostika!",hint:"💡 Ovo je težak level s 4 popravka! Koristite termalnu kameru, POST karticu i povećalo da pronađete sve probleme."},{id:8,name:"Labavi kablovi - Nema slike i zvuka",description:"Računalo se pali, ali nema slike na monitoru i nema zvuka iz zvučnika. Ventilatori rade normalno.",symptoms:['📺 Monitor prikazu
