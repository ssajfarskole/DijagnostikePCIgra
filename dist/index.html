ali bez čudnih zvukova.","💡 LED diode na kućištu svijetle normalno tijekom pokretanja.","🌀 Ventilatori se vrte normalno, ali nema slike."],difficulty:"Srednje",difficultyStars:2,components:Da({gpu:"loose",gpuPowerCable:"loose"}),fixes:[{componentId:"gpuPowerCable",toolId:"screwdriver",description:"✅ GPU kabel napajanja odspojen!",targetStatus:"removed"},{componentId:"gpu",toolId:"screwdriver",description:"✅ GPU izvađen iz PCIe utora!",targetStatus:"removed"},{componentId:"gpu",toolId:"replacement",description:"✅ GPU ponovno pravilno postavljen u PCIe utor!",targetStatus:"working"},{componentId:"gpuPowerCable",toolId:"hand",description:"✅ GPU kabel napajanja vraćen i spojen!",targetStatus:"working"}],diagnostics:[{componentId:"motherboard",toolId:"postCard",message:"🖥️ POST kod: 1 dugi, 2 kratka piska = GREŠKA GRAFIČKE KARTICE! GPU nije pravilno prepoznat.",type:"error"},{componentId:"gpu",toolId:"magnifier",message:"🔍 Vizualni pregled GPU-a: Kartica je LABAVO POSTAVLJENA u PCIe utoru! Desna strana je podignuta - nije pravilno sjedila u utor.",type:"error"},{componentId:"gpuPowerCable",toolId:"magnifier",message:"🔍 Kabel napajanja GPU-a je DJELOMIČNO ODVOJEN! PCIe power konektor nije čvrsto spojen. To može uzrokovati nestabilnost.",type:"warning"},{componentId:"gpu",toolId:"thermalCamera",message:"🌡️ GPU temperatura: N/A - kartica nije pravilno spojena pa ne radi.",type:"warning"},{componentId:"cpu",toolId:"magnifier",message:"🔍 Procesor je pravilno postavljen i izgleda u redu.",type:"info"},{componentId:"ram1",toolId:"magnifier",message:"🔍 RAM moduli su pravilno postavljeni.",type:"info"},{componentId:"psu",toolId:"powerTester",message:"🔌 Napajanje radi normalno, svi naponi unutar granica.",type:"info"}],completionMessage:"🏆 Odlično! Grafička kartica i njen kabel napajanja su ponovno pravilno spojeni. Slika se vraća na monitor!",educationalNote:'📖 Grafička kartica mora biti čvrsto postavljena u PCIe utor i imati properno spojen kabel napajanja. Ako je labava, računalo se pali ali nema slike. Uvijek čujete "klik" kad je kartica pravilno postavljena.',hint:"💡 Koristite povećalo na grafičkoj kartici i njenom kablovima napajanja."},{id:5,name:"Čudni zvukovi i sporo pokretanje",description:"Računalo radi sve sporije. Čuje se klikatanje iz kućišta. Pokretanje Windowsa traje jako dugo, a programi se sporo učitavaju.",symptoms:["🔊 U kućištu se čuju čudni klikovi i kliktanje.","🐌 Windows se pokreće jako sporo i sve traje duže.","⏳ Programi trebaju dugo da se pokrenu.","❌ Ekran se povremeno zamrzava bez upozorenja."],difficulty:"Srednje",difficultyStars:2,components:Da({hdd:"failing"}),fixes:[{componentId:"hdd",toolId:"replacement",description:"✅ Stari pokvareni HDD je uklonjen! Sada trebate instalirati novi SSD disk.",targetStatus:"removed"},{componentId:"ssd",toolId:"replacement",description:"✅ Novi SSD disk je instaliran! Brzina čitanja: 550MB/s, pisanja: 520MB/s. Windows je instaliran i računalo je ponovno brzo!",targetStatus:"working"}],diagnostics:[{componentId:"hdd",toolId:"magnifier",message:'🔍 Hard disk proizvodi zvukove klikanja - to je "CLICK OF DEATH"! Mehanički dio diska je oštećen i disk će uskoro potpuno zatajiti.',type:"error"},{componentId:"hdd",toolId:"diagnosticDisk",message:`💿 SMART dijagnostika HDD-a:
